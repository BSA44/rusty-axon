[package]
name = "rusty-axon"
version = "0.3.0"
edition = "2021"

# ---------------------------------------------------------------------------
# Feature flags
#
# `train`           — engine, autograd, optim, loss, visualization, Node-based nn.
# `inference`       — (Phase 6) pure-`&[f32]` forward path; engine module gated out.
# `matrixmultiply`  — link the `matrixmultiply` crate (auto-NEON on aarch64).
# `naive-matmul`    — (Phase 4) force the naive kernel; used for the
#                     speedup-vs-NEON table in the paper benchmarks.
# `quant-i8`        — (Phase 7) INT8 post-training quantization load/save
#                     + dequant-fused matmul.
# ---------------------------------------------------------------------------
[features]
default = ["train", "matrixmultiply"]
train = []
inference = []
matrixmultiply = ["dep:matrixmultiply"]
naive-matmul = []
quant-i8 = []

[dependencies]
rand = "0.9.2"
csv = "1.3"
sysinfo = "0.30"
# Pinned exactly so timing tables are reproducible across rebuilds.
matrixmultiply = { version = "=0.3.9", optional = true }

# Phase 8: criterion drives the benchmark suite under benches/. Pinned so
# timing tables (and JSON schema) are stable across rebuilds.
[dev-dependencies]
criterion = "=0.5.1"

# ---------------------------------------------------------------------------
# Profiles
#
# `release-edge` is the profile used for the binary-size table and shipped
# edge-device artifacts. `panic = "abort"` removes unwind metadata
# (~30–80 KB savings); we do not rely on `catch_unwind`.
# ---------------------------------------------------------------------------
[profile.release-edge]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = "symbols"

# ---------------------------------------------------------------------------
# Binary and example targets
#
# Everything that pulls in Node/Mlp/optim/loss is gated on `train` so that
# `cargo check --no-default-features --features inference` stays green while
# Phase 6 is still pending.
# ---------------------------------------------------------------------------
# `cargo bench` defaults to also running unit-tests-as-benches with the
# default libtest harness, which doesn't understand criterion's CLI flags
# (e.g. `--save-baseline`).  Disable that path so `cargo bench` only invokes
# the [[bench]] targets below.
[lib]
bench = false

[[bin]]
name = "rusty-axon"
path = "src/main.rs"
required-features = ["train"]
bench = false

[[example]]
name = "basic_autograd"
path = "examples/basic_autograd.rs"
required-features = ["train"]

[[example]]
name = "neural_network"
path = "examples/neural_network.rs"
required-features = ["train"]

[[example]]
name = "xor_problem"
path = "examples/xor_problem.rs"
required-features = ["train"]

[[example]]
name = "xor_relu"
path = "examples/xor_relu.rs"
required-features = ["train"]

[[example]]
name = "graph_visualization"
path = "examples/graph_visualization.rs"
required-features = ["train"]

[[example]]
name = "network_visualization"
path = "examples/network_visualization.rs"
required-features = ["train"]

[[example]]
name = "custom_colors"
path = "examples/custom_colors.rs"
required-features = ["train"]

[[example]]
name = "mnist_classifier"
path = "examples/mnist_classifier.rs"
required-features = ["train"]

[[example]]
name = "bench_classification_diabetes_sgd"
path = "examples/bench_classification_diabetes_sgd.rs"
required-features = ["train"]

[[example]]
name = "bench_classification_diabetes_meprop"
path = "examples/bench_classification_diabetes_meprop.rs"
required-features = ["train"]

[[example]]
name = "bench_regression_housing_sgd"
path = "examples/bench_regression_housing_sgd.rs"
required-features = ["train"]

[[example]]
name = "bench_regression_housing_meprop"
path = "examples/bench_regression_housing_meprop.rs"
required-features = ["train"]

[[example]]
name = "bench_mnist_matmul"
path = "examples/bench_mnist_matmul.rs"
required-features = ["train"]

[[example]]
name = "min_inference"
path = "examples/min_inference.rs"
required-features = ["inference"]

# Phase 9: aarch64 Raspberry Pi Zero 2 W cross-compile target.  Pure-`f32`
# inference, arena-backed, no stdin parsing — kept minimal for the Phase 10
# binary-size matrix and as the cross-compile smoke-test artifact.
[[example]]
name = "rpi_inference"
path = "examples/rpi_inference.rs"
required-features = ["inference"]

# ---------------------------------------------------------------------------
# Benches (Phase 8)
#
# All benches use the bigger MLP architecture from `examples/bench_mnist_matmul.rs`:
#   784 -> 640 -> 320 -> 100 -> 10  with [ReLU, ReLU, ReLU, None].
#
# Per-file `#[cfg(...)]` gates around `criterion_main!` make each bench a
# no-op under feature combos it doesn't apply to, so each `cargo bench`
# invocation only runs the relevant subset (see docs/BENCH_COMMANDS.md).
# ---------------------------------------------------------------------------
[[bench]]
name = "forward_train"
harness = false
path = "benches/forward_train.rs"

[[bench]]
name = "forward_train_legacy"
harness = false
path = "benches/forward_train_legacy.rs"

[[bench]]
name = "forward_infer_f32"
harness = false
path = "benches/forward_infer_f32.rs"

[[bench]]
name = "forward_infer_i8"
harness = false
path = "benches/forward_infer_i8.rs"

[[bench]]
name = "training_step"
harness = false
path = "benches/training_step.rs"

[[bench]]
name = "finetune_step"
harness = false
path = "benches/finetune_step.rs"

[[bench]]
name = "matmul_kernel"
harness = false
path = "benches/matmul_kernel.rs"
